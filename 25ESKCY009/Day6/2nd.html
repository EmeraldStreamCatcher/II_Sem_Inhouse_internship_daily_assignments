<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Fetch</title>
    <link rel="stylesheet" href="../bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 45%, #334155 100%);
            color: #f8fafc;
            min-height: 100vh;
        }
        .container {
            padding: 3rem 0;
        }
        .card {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(148, 163, 184, 0.18);
            color: #e2e8f0;
        }
        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-top-left-radius: 0.5rem;
            border-top-right-radius: 0.5rem;
        }
        .card-body h4 {
            color: #f8fafc;
        }
        .card-body p {
            color: #cbd5e1;
        }
        .details {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="text-center mb-4">
            <h2 class="text-white">User Records</h2>
            <p class="text-muted">Fetched from JSONPlaceholder and displayed in cards like the first page.</p>
        </div>
        <div id="container" class="row g-4"></div>
    </div>

    <script>
        fetch("https://jsonplaceholder.typicode.com/users")
            .then(res => res.json())
            .then(data => {
                let html = "";
                data.forEach((user, index) => {
                    html += `
                    <div class="col-md-4 card-item">
                        <div class="card shadow">
                            <img src="https://i.pravatar.cc/150?img=${(index % 70) + 1}" alt="User avatar">
                            <div class="card-body">
                                <h4>${user.name}</h4>
                                <button class="btn btn-primary btn-sm mt-2">show details</button>
                                <div class="details mt-3">
                                    <p><strong>Username:</strong> ${user.username}</p>
                                    <p><strong>Email:</strong> ${user.email}</p>
                                    <p><strong>Company:</strong> ${user.company.name}</p>
                                    <p><strong>City:</strong> ${user.address.city}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    `;
                });
                document.getElementById("container").innerHTML = html;
            })
            .catch(error => {
                document.getElementById("container").innerHTML = `<div class="col-12 text-center text-danger">Failed to load data.</div>`;
                console.error(error);
            });

        $(document).on("click", ".btn", function() {
            $(this).next(".details").fadeToggle(250);
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Cards</title>
    <link rel="stylesheet" href="../bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 45%, #334155 100%);
            color: #f8fafc;
        }

        .card {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(148, 163, 184, 0.18);
            color: #e2e8f0;
        }

        .card-body {
            color: #e2e8f0;
        }

        .card-body h4 {
            color: #f8fafc;
        }

        .card-body p {
            color: #cbd5e1;
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-top-left-radius: 0.5rem;
            border-top-right-radius: 0.5rem;
        }

        .details {
            display: none;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container py-5">
        <h2 class="text-center mb-4">Student Records</h2>
        <input type="text" id="search" class="form-control mb-4" placeholder="Search Student">
        <div id="container" class="row g-4"></div>
    </div>
    
    <script>
        const students=[
            {name:"Kapil",branch:"CSE",cgpa:8.4},
            {name:"Aditya",branch:"CSE",cgpa:8.2},
            {name:"Manas",branch:"CSE",cgpa:7.7},
            {name:"Ayush",branch:"IT",cgpa:8.4},
            {name:"Armin",branch:"CSE",cgpa:9.9},
            {name:"Eren",branch:"IT",cgpa:9.4},
            {name:"Bhavya",branch:"EE",cgpa:8.6},
            {name:"Kapil Sharma",branch:"CS",cgpa:8.4},
            {name:"Surya",branch:"CSE",cgpa:8.0},
            {name:"Levi",branch:"CSE",cgpa:10},
        ];

        let html="";

        for(let i=0;i<students.length;i++){
            html += `
            <div class="col-md-4 card-item">
                <div class="card shadow">
                    <img src="https://i.pravatar.cc/150?img=${(i % 70) + 1}" alt="Student avatar">
                    <div class="card-body">
                        <h4>${students[i].name}</h4>
                        <button class="btn btn-primary btn-sm mt-2">
                            show details
                        </button>

                        <div class="details mt-3">
                            <p><strong>Branch:</strong> ${students[i].branch}</p>
                            <p><strong>CGPA:</strong> ${students[i].cgpa}</p>
                        </div>
                    </div>
                </div>
            </div>
            `;
        }

        document.getElementById("container").innerHTML=html;

        // show/hide details with fade animation
        $(document).on("click", ".btn", function() {
            $(this).next(".details").fadeToggle(250);
        });

        //search student 
        $("#search").keyup(function(){
            let val=$(this).val().toLowerCase();

            $(".card-item").each(function(){
                let name=$(this).find("h4").text().toLowerCase();

                if(name.includes(val)){
                    $(this).show();
                }
                else{
                    $(this).hide();
                }
            });
        })
    </script>
</body>
</html>
